
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>GridPad Alpha</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap');

  /* ═══════════════════════════════════════════
     THEME 1: CREAM PAPER
     ═══════════════════════════════════════════ */
  [data-theme="cream"] {
    --bg-deep: #e8e0ca;
    --bg-surface: #f5f0e1;
    --bg-card: #f5f0e1;
    --bg-card-hover: #ede5d0;
    --bg-elevated: #fff;
    --border: #a8b8c4;
    --border-light: #a8b8c4;
    --border-focus: #2980b9;
    --text-primary: #2c3e50;
    --text-secondary: #5a6c7d;
    --text-muted: #8a9bab;
    --accent-main: #2980b9;
    --accent-main-dim: rgba(41, 128, 185, 0.08);
    --accent-danger: #c0392b;
    --accent-danger-dim: rgba(192, 57, 43, 0.06);
    --accent-save: #2980b9;
    --accent-save-hover: #2471a3;
    --accent-tag: #2980b9;
    --line-faint: rgba(209, 218, 224, 0.5);
    --line-rule: #b8c4cc;
    --shadow-soft: 0 2px 20px rgba(0,0,0,0.08);
    --shadow-lift: 0 8px 40px rgba(0,0,0,0.15);
    --glow-accent: none;
    --glow-danger: none;
    --overlay-bg: #f5f0e1;
    --dialog-bg: #f5f0e1;
    --dialog-backdrop: rgba(44, 62, 80, 0.4);
    --input-bg: rgba(255,255,255,0.6);
    --input-focus-bg: rgba(255,255,255,0.9);
    --content-item-bg: rgba(255,255,255,0.5);
    --scrollbar-thumb: #b8c4cc;
    --scrollbar-hover: #8a9bab;
    --red-line-opacity: 0.3;
    --btn-primary-bg: #2c3e50;
    --btn-primary-color: #f5f0e1;
    --btn-primary-hover-bg: #2980b9;
    --btn-primary-hover-border: #2980b9;
    --paper-line-opacity: 0.5;
    --cell-line-opacity: 0.6;
    --overlay-line-opacity: 0.3;
    --dot-glow: none;
    --letter-btn-bg: rgba(255,255,255,0.5);
    --letter-btn-active: #2c3e50;
    --letter-btn-active-color: #f5f0e1;
  }

  /* ═══════════════════════════════════════════
     THEME 2: MIDNIGHT (dark GitHub)
     ═══════════════════════════════════════════ */
  [data-theme="midnight"] {
    --bg-deep: #0d1117;
    --bg-surface: #161b22;
    --bg-card: #1c2129;
    --bg-card-hover: #21262d;
    --bg-elevated: #242a33;
    --border: #30363d;
    --border-light: #21262d;
    --border-focus: #58a6ff;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #484f58;
    --accent-main: #58a6ff;
    --accent-main-dim: rgba(88, 166, 255, 0.12);
    --accent-danger: #f85149;
    --accent-danger-dim: rgba(248, 81, 73, 0.12);
    --accent-save: #58a6ff;
    --accent-save-hover: #79b8ff;
    --accent-tag: #bc8cff;
    --line-faint: rgba(48, 54, 61, 0.5);
    --line-rule: rgba(48, 54, 61, 0.8);
    --shadow-soft: 0 2px 20px rgba(0,0,0,0.3);
    --shadow-lift: 0 8px 40px rgba(0,0,0,0.5);
    --glow-accent: 0 0 20px rgba(88, 166, 255, 0.15);
    --glow-danger: 0 0 16px rgba(248, 81, 73, 0.15);
    --overlay-bg: #0d1117;
    --dialog-bg: #161b22;
    --dialog-backdrop: rgba(0, 0, 0, 0.6);
    --input-bg: #1c2129;
    --input-focus-bg: #242a33;
    --content-item-bg: #161b22;
    --scrollbar-thumb: #30363d;
    --scrollbar-hover: #484f58;
    --red-line-opacity: 0.2;
    --btn-primary-bg: #e6edf3;
    --btn-primary-color: #0d1117;
    --btn-primary-hover-bg: #58a6ff;
    --btn-primary-hover-border: #58a6ff;
    --paper-line-opacity: 0.4;
    --cell-line-opacity: 0.4;
    --overlay-line-opacity: 0.2;
    --dot-glow: 0 0 8px rgba(88, 166, 255, 0.4);
    --letter-btn-bg: rgba(255,255,255,0.05);
    --letter-btn-active: #58a6ff;
    --letter-btn-active-color: #0d1117;
  }

  /* ═══════════════════════════════════════════
     THEME 3: DUSK (purple/warm)
     ═══════════════════════════════════════════ */
  [data-theme="dusk"] {
    --bg-deep: #1a1525;
    --bg-surface: #221c30;
    --bg-card: #2a2339;
    --bg-card-hover: #332b44;
    --bg-elevated: #3a3150;
    --border: #3e3555;
    --border-light: #2f2841;
    --border-focus: #e8976c;
    --text-primary: #ede4f5;
    --text-secondary: #a99bbe;
    --text-muted: #6b5f80;
    --accent-main: #e8976c;
    --accent-main-dim: rgba(232, 151, 108, 0.12);
    --accent-danger: #d4728c;
    --accent-danger-dim: rgba(212, 114, 140, 0.12);
    --accent-save: #e8976c;
    --accent-save-hover: #eead8a;
    --accent-tag: #e2b96e;
    --line-faint: rgba(62, 53, 85, 0.5);
    --line-rule: rgba(62, 53, 85, 0.8);
    --shadow-soft: 0 2px 20px rgba(0,0,0,0.3);
    --shadow-lift: 0 8px 40px rgba(0,0,0,0.5);
    --glow-accent: 0 0 20px rgba(232, 151, 108, 0.15);
    --glow-danger: 0 0 16px rgba(212, 114, 140, 0.15);
    --overlay-bg: #1a1525;
    --dialog-bg: #221c30;
    --dialog-backdrop: rgba(0, 0, 0, 0.6);
    --input-bg: #2a2339;
    --input-focus-bg: #3a3150;
    --content-item-bg: #221c30;
    --scrollbar-thumb: #3e3555;
    --scrollbar-hover: #6b5f80;
    --red-line-opacity: 0.2;
    --btn-primary-bg: #ede4f5;
    --btn-primary-color: #1a1525;
    --btn-primary-hover-bg: #e8976c;
    --btn-primary-hover-border: #e8976c;
    --paper-line-opacity: 0.4;
    --cell-line-opacity: 0.4;
    --overlay-line-opacity: 0.2;
    --dot-glow: 0 0 8px rgba(232, 151, 108, 0.4);
    --letter-btn-bg: rgba(255,255,255,0.05);
    --letter-btn-active: #e8976c;
    --letter-btn-active-color: #1a1525;
  }

  /* ═══════════════════════════════════════════
     CORE STYLES (theme-agnostic)
     ═══════════════════════════════════════════ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'IBM Plex Mono', monospace;
    background: var(--bg-deep);
    color: var(--text-primary);
    transition: background 0.35s ease, color 0.35s ease;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  /* ─── PAPER TEXTURE BG ─── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      repeating-linear-gradient(
        0deg, transparent, transparent 31px,
        var(--line-faint) 31px, var(--line-faint) 32px
      ),
      repeating-linear-gradient(
        90deg, transparent, transparent 31px,
        var(--line-faint) 31px, var(--line-faint) 32px
      );
    opacity: var(--paper-line-opacity);
    pointer-events: none;
    z-index: 0;
    transition: opacity 0.35s ease;
  }

  /* ─── TOP BAR ─── */
  .top-bar {
    position: relative;
    z-index: 10;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 12px rgba(0,0,0,0.15);
    transition: background 0.35s, border-color 0.35s;
  }

  .top-bar-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
  }

  .top-bar-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .top-bar h1 {
    font-family: 'Caveat', cursive;
    font-size: 24px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.5px;
    transition: color 0.35s;
  }

  .top-bar h1 span {
    color: var(--accent-main);
    transition: color 0.35s;
  }

  /* Current letter display */
  .current-letter-display {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    background: var(--accent-main);
    color: var(--btn-primary-color);
    border-radius: 6px;
    font-family: 'Caveat', cursive;
    font-size: 18px;
    font-weight: 600;
  }

  .top-bar-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .grid-controls {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .grid-controls label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    font-weight: 500;
    transition: color 0.35s;
    display: none;
  }

  .grid-size-btn {
    width: 32px;
    height: 32px;
    border: 1.5px solid var(--border);
    background: var(--bg-surface);
    border-radius: 6px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  .grid-size-btn:hover, .grid-size-btn:active {
    background: var(--accent-main);
    color: var(--bg-deep);
    border-color: var(--accent-main);
    transform: translateY(-1px);
    box-shadow: var(--glow-accent);
  }

  .grid-size-btn.active {
    background: var(--text-primary);
    color: var(--bg-deep);
    border-color: var(--text-primary);
  }

  /* ─── THEME TOGGLE ─── */
  .theme-toggle {
    width: 32px;
    height: 32px;
    border: 1.5px solid var(--border);
    background: var(--bg-surface);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }

  .theme-toggle:hover, .theme-toggle:active {
    border-color: var(--accent-main);
    box-shadow: var(--glow-accent);
    transform: translateY(-1px);
  }

  /* Theme picker dropdown - FIXED colors independent of theme */
  .theme-picker {
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 8px;
    background: #ffffff;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.18);
    z-index: 50;
    display: none;
    overflow: hidden;
    min-width: 180px;
  }

  .theme-picker.visible {
    display: block;
    animation: pickerDrop 0.2s ease;
  }

  @keyframes pickerDrop {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .theme-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    cursor: pointer;
    transition: background 0.1s;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #374151;
    -webkit-tap-highlight-color: transparent;
  }

  .theme-option:hover, .theme-option:active {
    background: #f3f4f6;
  }

  .theme-option.active {
    font-weight: 500;
    color: #2563eb;
  }

  .theme-swatch {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #d1d5db;
    flex-shrink: 0;
  }

  .theme-option.active .theme-swatch {
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
  }

  .swatch-cream { background: linear-gradient(135deg, #f5f0e1, #e8e0ca); }
  .swatch-midnight { background: linear-gradient(135deg, #161b22, #0d1117); }
  .swatch-dusk { background: linear-gradient(135deg, #2a2339, #1a1525); }

  /* ─── LETTER SELECTOR BAR ─── */
  .letter-bar {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    gap: 4px;
    overflow-x: auto;
    overflow-y: hidden;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-light);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -ms-overflow-style: none;
    transition: background 0.35s, border-color 0.35s;
  }

  .letter-bar::-webkit-scrollbar {
    display: none;
  }

  .letter-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border: 1.5px solid var(--border-light);
    background: var(--letter-btn-bg);
    border-radius: 6px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  .letter-btn:hover, .letter-btn:active {
    background: var(--accent-main-dim);
    border-color: var(--accent-main);
    color: var(--accent-main);
  }

  .letter-btn.active {
    background: var(--letter-btn-active);
    color: var(--letter-btn-active-color);
    border-color: var(--letter-btn-active);
    font-weight: 600;
  }

  .letter-btn.has-content::after {
    content: '';
    position: absolute;
    top: 3px;
    right: 3px;
    width: 6px;
    height: 6px;
    background: var(--accent-main);
    border-radius: 50%;
  }

  .letter-btn.has-content {
    position: relative;
  }

  /* ─── KEYBOARD HINTS ─── */
  .keyboard-hint {
    font-size: 9px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    display: none;
  }

  /* ─── GRID ─── */
  .grid-container {
    position: relative;
    z-index: 1;
    height: calc(100vh - 54px - 52px);
    height: calc(100dvh - 54px - 52px);
    overflow: auto;
    padding: 8px;
    -webkit-overflow-scrolling: touch;
  }

  .grid {
    display: grid;
    gap: 2px;
    min-height: 100%;
    transition: all 0.3s ease;
  }

  .grid-cell {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: 4px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 72px;
    -webkit-tap-highlight-color: transparent;
  }

  .grid-cell::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        0deg, transparent, transparent 23px,
        var(--line-faint) 23px, var(--line-faint) 24px
      );
    opacity: var(--cell-line-opacity);
    pointer-events: none;
  }

  .grid-cell:hover {
    background: var(--bg-card-hover);
    border-color: var(--accent-main);
    box-shadow: var(--glow-accent);
    transform: translateY(-1px);
  }

  .grid-cell:active {
    transform: translateY(0);
  }

  .grid-cell.has-content {
    border-color: var(--border);
  }

  .grid-cell.has-content::after {
    content: '';
    position: absolute;
    top: 5px;
    right: 5px;
    width: 7px;
    height: 7px;
    background: var(--accent-main);
    border-radius: 50%;
    opacity: 0.8;
    box-shadow: var(--dot-glow);
  }

  /* Cell number badge */
  .cell-number {
    position: absolute;
    bottom: 4px;
    right: 6px;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
    opacity: 0.6;
    transition: opacity 0.2s, color 0.2s;
    z-index: 2;
  }

  .grid-cell:hover .cell-number {
    opacity: 1;
    color: var(--accent-main);
  }

  .cell-preview {
    position: relative;
    z-index: 1;
    padding: 8px;
    padding-bottom: 20px;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow: hidden;
  }

  .cell-preview-text {
    color: var(--text-secondary);
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    font-family: 'Caveat', cursive;
    font-size: 13px;
    transition: color 0.35s;
  }

  .cell-preview-url {
    font-size: 9px;
    color: var(--accent-main);
    text-decoration: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color 0.35s;
  }

  .cell-preview-img {
    width: 100%;
    height: 50px;
    object-fit: cover;
    border-radius: 2px;
    opacity: 0.8;
  }

  .cell-empty-icon {
    position: relative;
    z-index: 1;
    font-size: 18px;
    color: var(--text-muted);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .grid-cell:hover .cell-empty-icon {
    opacity: 0.5;
  }

  /* ─── FULLSCREEN OVERLAY ─── */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--overlay-bg);
    display: none;
    flex-direction: column;
    opacity: 0;
    transition: opacity 0.25s ease, background 0.35s;
  }

  .overlay.visible {
    display: flex;
    opacity: 1;
  }

  .overlay::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        0deg, transparent, transparent 31px,
        var(--line-rule) 31px, var(--line-rule) 32px
      );
    opacity: var(--overlay-line-opacity);
    pointer-events: none;
  }

  .overlay::after {
    content: '';
    position: absolute;
    left: 28px;
    top: 60px;
    bottom: 20px;
    width: 2px;
    background: var(--accent-danger);
    opacity: var(--red-line-opacity);
    pointer-events: none;
  }

  .overlay-header {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-surface);
    transition: background 0.35s, border-color 0.35s;
  }

  .overlay-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .overlay-title {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
    transition: color 0.35s;
  }

  .overlay-title-letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    background: var(--accent-main);
    color: var(--btn-primary-color);
    border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    margin-right: 4px;
  }

  .overlay-notepad {
    font-size: 24px;
    line-height: 1;
  }

  .close-btn {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 300;
    color: var(--text-secondary);
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'IBM Plex Mono', monospace;
    -webkit-tap-highlight-color: transparent;
  }

  .close-btn:hover, .close-btn:active {
    color: var(--accent-danger);
    border-color: var(--accent-danger);
    background: var(--accent-danger-dim);
    box-shadow: var(--glow-danger);
  }

  .overlay-body {
    position: relative;
    z-index: 2;
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    -webkit-overflow-scrolling: touch;
  }

  /* ─── VIEW MODE ─── */
  .view-content {
    max-width: 700px;
    margin: 0 auto;
  }

  .content-item {
    margin-bottom: 16px;
    padding: 14px 16px;
    background: var(--content-item-bg);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    animation: slideUp 0.3s ease forwards;
    opacity: 0;
    transform: translateY(10px);
    transition: background 0.35s, border-color 0.35s;
  }

  @keyframes slideUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .content-item:nth-child(1) { animation-delay: 0.05s; }
  .content-item:nth-child(2) { animation-delay: 0.1s; }
  .content-item:nth-child(3) { animation-delay: 0.15s; }
  .content-item:nth-child(4) { animation-delay: 0.2s; }
  .content-item:nth-child(5) { animation-delay: 0.25s; }

  .content-item-type {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin-bottom: 5px;
    font-weight: 500;
    transition: color 0.35s;
  }

  .content-item-text {
    font-family: 'Caveat', cursive;
    font-size: 19px;
    line-height: 1.5;
    color: var(--text-primary);
    word-break: break-word;
    transition: color 0.35s;
  }

  .content-item-url {
    color: var(--accent-main);
    font-size: 13px;
    text-decoration: none;
    word-break: break-all;
    transition: color 0.15s;
  }

  .content-item-url:hover {
    text-decoration: underline;
  }

  .content-item-image {
    max-width: 100%;
    max-height: 300px;
    border-radius: 6px;
    object-fit: contain;
    display: block;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .empty-state-icon {
    font-size: 56px;
    margin-bottom: 12px;
    opacity: 0.4;
  }

  .empty-state-text {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    transition: color 0.35s;
  }

  /* ─── ACTION BUTTONS ─── */
  .overlay-footer {
    position: relative;
    z-index: 2;
    padding: 12px 20px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    background: var(--bg-surface);
    display: flex;
    justify-content: center;
    gap: 10px;
    transition: background 0.35s, border-color 0.35s;
  }

  .btn {
    padding: 10px 24px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--bg-surface);
    color: var(--text-primary);
    -webkit-tap-highlight-color: transparent;
  }

  .btn:hover, .btn:active {
    transform: translateY(-1px);
    box-shadow: var(--shadow-soft);
    background: var(--bg-elevated);
  }

  .btn-primary {
    background: var(--btn-primary-bg);
    color: var(--btn-primary-color);
    border-color: var(--btn-primary-bg);
  }

  .btn-primary:hover, .btn-primary:active {
    background: var(--btn-primary-hover-bg);
    border-color: var(--btn-primary-hover-border);
    color: var(--btn-primary-color);
    box-shadow: var(--glow-accent);
  }

  .btn-danger {
    color: var(--accent-danger);
    border-color: var(--accent-danger);
  }

  .btn-danger:hover, .btn-danger:active {
    background: var(--accent-danger);
    color: white;
    box-shadow: var(--glow-danger);
  }

  .btn-save {
    background: var(--accent-save);
    color: var(--bg-deep);
    border-color: var(--accent-save);
    font-weight: 500;
  }

  .btn-save:hover, .btn-save:active {
    background: var(--accent-save-hover);
    border-color: var(--accent-save-hover);
    box-shadow: var(--glow-accent);
  }

  /* ─── EDIT MODE ─── */
  .edit-form {
    max-width: 700px;
    margin: 0 auto;
  }

  .edit-section {
    margin-bottom: 20px;
  }

  .edit-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .edit-section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    font-weight: 500;
    transition: color 0.35s;
  }

  .add-item-btn {
    font-size: 11px;
    padding: 4px 12px;
    border: 1.5px dashed var(--accent-main);
    background: none;
    color: var(--accent-main);
    border-radius: 4px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .add-item-btn:hover, .add-item-btn:active {
    background: var(--accent-main-dim);
    box-shadow: var(--glow-accent);
  }

  .edit-item {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
    align-items: flex-start;
  }

  .edit-input {
    flex: 1;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    background: var(--input-bg);
    color: var(--text-primary);
    transition: all 0.15s;
    resize: vertical;
  }

  .edit-input:focus {
    outline: none;
    border-color: var(--accent-main);
    background: var(--input-focus-bg);
    box-shadow: 0 0 0 3px var(--accent-main-dim);
  }

  .edit-input::placeholder {
    color: var(--text-muted);
    opacity: 0.6;
  }

  textarea.edit-input {
    min-height: 56px;
  }

  .remove-item-btn {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border: none;
    background: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 18px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    margin-top: 4px;
    -webkit-tap-highlight-color: transparent;
  }

  .remove-item-btn:hover, .remove-item-btn:active {
    color: var(--accent-danger);
    background: var(--accent-danger-dim);
  }

  /* ─── CONFIRM DIALOG ─── */
  .dialog-backdrop {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: var(--dialog-backdrop);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
  }

  .dialog-backdrop.visible {
    display: flex;
  }

  .dialog {
    background: var(--dialog-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    max-width: 340px;
    width: 90%;
    box-shadow: var(--shadow-lift);
    text-align: center;
    animation: dialogPop 0.2s ease;
    transition: background 0.35s, border-color 0.35s;
  }

  @keyframes dialogPop {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .dialog-icon {
    font-size: 36px;
    margin-bottom: 10px;
  }

  .dialog-text {
    font-family: 'Caveat', cursive;
    font-size: 20px;
    color: var(--text-primary);
    margin-bottom: 20px;
    line-height: 1.3;
    transition: color 0.35s;
  }

  .dialog-buttons {
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  /* ─── SCROLLBAR ─── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--scrollbar-thumb);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }

  /* ─── RESPONSIVE ─── */
  @media (min-width: 600px) {
    .top-bar-main { padding: 12px 24px; }
    .top-bar h1 { font-size: 28px; }
    .letter-bar { padding: 10px 24px; gap: 6px; }
    .letter-btn { width: 40px; height: 40px; font-size: 15px; }
    .keyboard-hint { display: inline; margin-left: 4px; }
    .grid-container {
      height: calc(100vh - 54px - 56px);
      height: calc(100dvh - 54px - 56px);
      padding: 16px;
    }
    .grid-controls label { display: block; }
    .overlay-body { padding: 32px 48px; }
    .overlay-header { padding: 16px 28px; }
    .overlay-footer { padding: 16px 28px; }
    .grid-cell { min-height: 80px; }
  }

  @media (max-width: 599px) {
    .current-letter-display {
      padding: 3px 8px;
      font-size: 14px;
    }
  }

  /* Safe areas for notched phones */
  @supports (padding-top: env(safe-area-inset-top)) {
    .top-bar-main {
      padding-top: max(10px, env(safe-area-inset-top));
    }
    .grid-container {
      padding-bottom: max(8px, env(safe-area-inset-bottom));
    }
  }
</style>
</head>
<body data-theme="cream">

<!-- TOP BAR -->
<div class="top-bar">
  <div class="top-bar-main">
    <div class="top-bar-left">
      <h1>Grid<span>Pad</span></h1>
      <div class="current-letter-display" id="currentLetterDisplay">A</div>
    </div>
    <div class="top-bar-right">
      <div class="grid-controls">
        <label>Grid</label>
        <button class="grid-size-btn" data-cols="3" onclick="setGrid(3)">3</button>
        <button class="grid-size-btn active" data-cols="4" onclick="setGrid(4)">4</button>
        <button class="grid-size-btn" data-cols="5" onclick="setGrid(5)">5</button>
        <button class="grid-size-btn" data-cols="6" onclick="setGrid(6)">6</button>
      </div>
      <div style="position:relative">
        <button class="theme-toggle" id="themeToggle" onclick="toggleThemePicker()">🎨</button>
        <div class="theme-picker" id="themePicker">
          <button class="theme-option active" data-theme="cream" onclick="setTheme('cream')">
            <div class="theme-swatch swatch-cream"></div>
            Cream Paper
          </button>
          <button class="theme-option" data-theme="midnight" onclick="setTheme('midnight')">
            <div class="theme-swatch swatch-midnight"></div>
            Midnight
          </button>
          <button class="theme-option" data-theme="dusk" onclick="setTheme('dusk')">
            <div class="theme-swatch swatch-dusk"></div>
            Dusk
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- LETTER SELECTOR BAR -->
  <div class="letter-bar" id="letterBar"></div>
</div>

<!-- GRID -->
<div class="grid-container">
  <div class="grid" id="grid"></div>
</div>

<!-- FULLSCREEN OVERLAY -->
<div class="overlay" id="overlay">
  <div class="overlay-header">
    <div class="overlay-header-left">
      <span class="overlay-notepad">📝</span>
      <span class="overlay-title" id="overlayTitle">
        <span class="overlay-title-letter" id="overlayTitleLetter">A</span>
        <span id="overlayTitleText">Cell 1</span>
      </span>
    </div>
    <button class="close-btn" onclick="handleClose()">✕</button>
  </div>
  <div class="overlay-body" id="overlayBody"></div>
  <div class="overlay-footer" id="overlayFooter"></div>
</div>

<!-- CONFIRM DIALOG -->
<div class="dialog-backdrop" id="dialogBackdrop">
  <div class="dialog">
    <div class="dialog-icon">🤔</div>
    <div class="dialog-text">You have unsaved changes.<br>Save or discard?</div>
    <div class="dialog-buttons">
      <button class="btn btn-danger" onclick="discardChanges()">Discard</button>
      <button class="btn btn-save" onclick="saveAndClose()">Save</button>
    </div>
  </div>
</div>

<script>
  // ─── CONSTANTS ───
  const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const TOTAL_CELLS = 48;

  // ─── STATE ───
  let gridCols = 4;
  let currentLetter = 'A';
  let currentCell = null;
  let isEditing = false;
  let editDirty = false;
  let cellData = {};
  let currentTheme = 'cream';

  // ─── PERSISTENCE ───
  function loadData() {
    try {
      const raw = localStorage.getItem('gridpad_alpha_data');
      if (raw) cellData = JSON.parse(raw);
      const cols = localStorage.getItem('gridpad_alpha_cols');
      if (cols) gridCols = parseInt(cols);
      const letter = localStorage.getItem('gridpad_alpha_letter');
      if (letter && ALPHABET.includes(letter)) currentLetter = letter;
      const theme = localStorage.getItem('gridpad_alpha_theme');
      if (theme) {
        currentTheme = theme;
        document.body.setAttribute('data-theme', theme);
        updateThemePickerUI();
      }
    } catch(e) { console.warn('Could not load data:', e); }
  }

  function saveData() {
    try {
      localStorage.setItem('gridpad_alpha_data', JSON.stringify(cellData));
      localStorage.setItem('gridpad_alpha_cols', gridCols.toString());
      localStorage.setItem('gridpad_alpha_letter', currentLetter);
      localStorage.setItem('gridpad_alpha_theme', currentTheme);
    } catch(e) { console.warn('Could not save data:', e); }
  }

  // ─── THEME ───
  function setTheme(theme) {
    currentTheme = theme;
    document.body.setAttribute('data-theme', theme);
    updateThemePickerUI();
    saveData();
    closeThemePicker();
  }

  function updateThemePickerUI() {
    document.querySelectorAll('.theme-option').forEach(opt => {
      opt.classList.toggle('active', opt.dataset.theme === currentTheme);
    });
  }

  function toggleThemePicker() {
    const picker = document.getElementById('themePicker');
    picker.classList.toggle('visible');
  }

  function closeThemePicker() {
    document.getElementById('themePicker').classList.remove('visible');
  }

  // Close picker when tapping outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.theme-toggle') && !e.target.closest('.theme-picker')) {
      closeThemePicker();
    }
  });

  // ─── LETTER SELECTOR ───
  function renderLetterBar() {
    const bar = document.getElementById('letterBar');
    bar.innerHTML = '';

    ALPHABET.forEach(letter => {
      const btn = document.createElement('button');
      btn.className = 'letter-btn' + (letter === currentLetter ? ' active' : '');
      btn.textContent = letter;
      btn.dataset.letter = letter;

      // Check if this letter has any content
      const letterData = cellData[letter];
      if (letterData) {
        const hasContent = Object.values(letterData).some(cell => {
          return cell && (
            (cell.texts && cell.texts.some(t => t.trim())) ||
            (cell.urls && cell.urls.some(u => u.trim())) ||
            (cell.images && cell.images.some(img => img.trim()))
          );
        });
        if (hasContent) btn.classList.add('has-content');
      }

      btn.addEventListener('click', () => selectLetter(letter));
      bar.appendChild(btn);
    });

    // Scroll active letter into view
    setTimeout(() => {
      const activeBtn = bar.querySelector('.letter-btn.active');
      if (activeBtn) {
        activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }, 50);
  }

  function selectLetter(letter) {
    currentLetter = letter;
    saveData();
    updateLetterDisplay();
    renderLetterBar();
    renderGrid();
  }

  function updateLetterDisplay() {
    document.getElementById('currentLetterDisplay').textContent = currentLetter;
  }

  // ─── GRID ───
  function setGrid(cols) {
    gridCols = cols;
    document.querySelectorAll('.grid-size-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.cols) === cols);
    });
    saveData();
    renderGrid();
  }

  function renderGrid() {
    const grid = document.getElementById('grid');
    const rows = Math.ceil(TOTAL_CELLS / gridCols);
    grid.style.gridTemplateColumns = `repeat(${gridCols}, 1fr)`;
    grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    grid.innerHTML = '';

    for (let i = 0; i < TOTAL_CELLS; i++) {
      const cell = document.createElement('div');
      cell.className = 'grid-cell';

      // Get data for this cell under current letter
      const letterData = cellData[currentLetter] || {};
      const data = letterData[i];
      const hasContent = data && (
        (data.texts && data.texts.some(t => t.trim())) ||
        (data.urls && data.urls.some(u => u.trim())) ||
        (data.images && data.images.some(img => img.trim()))
      );

      if (hasContent) {
        cell.classList.add('has-content');
        const preview = document.createElement('div');
        preview.className = 'cell-preview';

        if (data.texts) {
          data.texts.filter(t => t.trim()).forEach(t => {
            const el = document.createElement('div');
            el.className = 'cell-preview-text';
            el.textContent = t;
            preview.appendChild(el);
          });
        }
        if (data.urls) {
          data.urls.filter(u => u.trim()).forEach(u => {
            const el = document.createElement('div');
            el.className = 'cell-preview-url';
            el.textContent = u;
            preview.appendChild(el);
          });
        }
        if (data.images) {
          data.images.filter(img => img.trim()).forEach(src => {
            const el = document.createElement('img');
            el.className = 'cell-preview-img';
            el.src = src;
            el.alt = '';
            el.onerror = () => el.style.display = 'none';
            preview.appendChild(el);
          });
        }
        cell.appendChild(preview);
      } else {
        const icon = document.createElement('div');
        icon.className = 'cell-empty-icon';
        icon.textContent = '+';
        cell.appendChild(icon);
      }

      // Add cell number badge
      const numberBadge = document.createElement('div');
      numberBadge.className = 'cell-number';
      numberBadge.textContent = (i + 1);
      cell.appendChild(numberBadge);

      cell.addEventListener('click', () => openCell(i));
      grid.appendChild(cell);
    }
  }

  // ─── OVERLAY ───
  function openCell(index) {
    currentCell = index;
    isEditing = false;
    editDirty = false;
    showViewMode();
    const overlay = document.getElementById('overlay');
    overlay.classList.add('visible');
    document.getElementById('overlayTitleLetter').textContent = currentLetter;
    document.getElementById('overlayTitleText').textContent = 'Cell ' + (index + 1);
  }

  function showViewMode() {
    isEditing = false;
    const body = document.getElementById('overlayBody');
    const footer = document.getElementById('overlayFooter');

    const letterData = cellData[currentLetter] || {};
    const data = letterData[currentCell] || { texts: [], urls: [], images: [] };
    const hasContent =
      (data.texts && data.texts.some(t => t.trim())) ||
      (data.urls && data.urls.some(u => u.trim())) ||
      (data.images && data.images.some(img => img.trim()));

    if (!hasContent) {
      body.innerHTML =
        '<div class="empty-state">' +
        '<div class="empty-state-icon">📋</div>' +
        '<div class="empty-state-text">Nothing here yet...</div>' +
        '</div>';
    } else {
      let html = '<div class="view-content">';
      let delay = 0;

      if (data.texts) {
        data.texts.filter(t => t.trim()).forEach(t => {
          html += '<div class="content-item" style="animation-delay:' + delay + 's">' +
            '<div class="content-item-type">Text</div>' +
            '<div class="content-item-text">' + escapeHtml(t) + '</div>' +
            '</div>';
          delay += 0.05;
        });
      }
      if (data.urls) {
        data.urls.filter(u => u.trim()).forEach(u => {
          const href = u.startsWith('http') ? u : 'https://' + u;
          html += '<div class="content-item" style="animation-delay:' + delay + 's">' +
            '<div class="content-item-type">Link</div>' +
            '<a class="content-item-url" href="' + escapeHtml(href) + '" target="_blank" rel="noopener">' + escapeHtml(u) + '</a>' +
            '</div>';
          delay += 0.05;
        });
      }
      if (data.images) {
        data.images.filter(img => img.trim()).forEach(src => {
          html += '<div class="content-item" style="animation-delay:' + delay + 's">' +
            '<div class="content-item-type">Image</div>' +
            '<img class="content-item-image" src="' + escapeHtml(src) + '" alt="" onerror="this.style.display=\'none\'">' +
            '</div>';
          delay += 0.05;
        });
      }

      html += '</div>';
      body.innerHTML = html;
    }

    footer.innerHTML = '<button class="btn btn-primary" onclick="showEditMode()">Edit</button>';
  }

  function showEditMode() {
    isEditing = true;
    editDirty = false;
    const footer = document.getElementById('overlayFooter');

    const letterData = cellData[currentLetter] || {};
    const data = letterData[currentCell] || { texts: [''], urls: [''], images: [''] };

    if (!data.texts || data.texts.length === 0) data.texts = [''];
    if (!data.urls || data.urls.length === 0) data.urls = [''];
    if (!data.images || data.images.length === 0) data.images = [''];

    renderEditForm(data);

    footer.innerHTML =
      '<button class="btn btn-save" onclick="saveChanges()">Save</button>' +
      '<button class="btn" onclick="handleClose()">Close</button>';
  }

  function renderEditForm(data) {
    const body = document.getElementById('overlayBody');
    let html = '<div class="edit-form">';

    // TEXTS
    html += '<div class="edit-section">' +
      '<div class="edit-section-header">' +
      '<span class="edit-section-title">📝 Text</span>' +
      '<button class="add-item-btn" onclick="addField(\'texts\')">+ add</button>' +
      '</div>';
    data.texts.forEach((t, i) => {
      html += '<div class="edit-item">' +
        '<textarea class="edit-input" data-type="texts" data-index="' + i + '" placeholder="Write something..." oninput="markDirty()">' + escapeHtml(t) + '</textarea>' +
        '<button class="remove-item-btn" onclick="removeField(\'texts\', ' + i + ')">×</button>' +
        '</div>';
    });
    html += '</div>';

    // URLS
    html += '<div class="edit-section">' +
      '<div class="edit-section-header">' +
      '<span class="edit-section-title">🔗 URLs</span>' +
      '<button class="add-item-btn" onclick="addField(\'urls\')">+ add</button>' +
      '</div>';
    data.urls.forEach((u, i) => {
      html += '<div class="edit-item">' +
        '<input class="edit-input" data-type="urls" data-index="' + i + '" placeholder="https://..." value="' + escapeHtml(u) + '" oninput="markDirty()">' +
        '<button class="remove-item-btn" onclick="removeField(\'urls\', ' + i + ')">×</button>' +
        '</div>';
    });
    html += '</div>';

    // IMAGES
    html += '<div class="edit-section">' +
      '<div class="edit-section-header">' +
      '<span class="edit-section-title">🖼️ Images</span>' +
      '<button class="add-item-btn" onclick="addField(\'images\')">+ add</button>' +
      '</div>';
    data.images.forEach((img, i) => {
      html += '<div class="edit-item">' +
        '<input class="edit-input" data-type="images" data-index="' + i + '" placeholder="Image URL..." value="' + escapeHtml(img) + '" oninput="markDirty()">' +
        '<button class="remove-item-btn" onclick="removeField(\'images\', ' + i + ')">×</button>' +
        '</div>';
    });
    html += '</div>';

    html += '</div>';
    body.innerHTML = html;
  }

  function markDirty() { editDirty = true; }

  function getEditData() {
    const data = { texts: [], urls: [], images: [] };
    document.querySelectorAll('[data-type]').forEach(el => {
      data[el.dataset.type][parseInt(el.dataset.index)] = el.value;
    });
    return data;
  }

  function addField(type) {
    const data = getEditData();
    data[type].push('');
    editDirty = true;
    renderEditForm(data);
    setTimeout(() => {
      const fields = document.querySelectorAll('[data-type="' + type + '"]');
      if (fields.length) fields[fields.length - 1].focus();
    }, 50);
  }

  function removeField(type, index) {
    const data = getEditData();
    data[type].splice(index, 1);
    if (data[type].length === 0) data[type] = [''];
    editDirty = true;
    renderEditForm(data);
  }

  function saveChanges() {
    const data = getEditData();

    // Initialize letter object if needed
    if (!cellData[currentLetter]) cellData[currentLetter] = {};
    cellData[currentLetter][currentCell] = data;

    saveData();
    editDirty = false;
    showViewMode();
    renderLetterBar(); // Update dot indicators
    renderGrid();
  }

  function handleClose() {
    if (isEditing && editDirty) {
      document.getElementById('dialogBackdrop').classList.add('visible');
    } else {
      closeOverlay();
    }
  }

  function saveAndClose() {
    document.getElementById('dialogBackdrop').classList.remove('visible');
    saveChanges();
    closeOverlay();
  }

  function discardChanges() {
    document.getElementById('dialogBackdrop').classList.remove('visible');
    editDirty = false;
    closeOverlay();
  }

  function closeOverlay() {
    document.getElementById('overlay').classList.remove('visible');
    currentCell = null;
    isEditing = false;
    editDirty = false;
  }

  // ─── UTILS ───
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ─── KEYBOARD NAVIGATION ───
  document.addEventListener('keydown', (e) => {
    // Don't interfere with input fields
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    // Escape to close overlay/dialog
    if (e.key === 'Escape') {
      if (document.getElementById('dialogBackdrop').classList.contains('visible')) {
        discardChanges();
      } else if (document.getElementById('overlay').classList.contains('visible')) {
        handleClose();
      }
      return;
    }

    // Letter key navigation (A-Z)
    if (/^[a-zA-Z]$/.test(e.key)) {
      const letter = e.key.toUpperCase();
      selectLetter(letter);
      return;
    }

    // Arrow keys for letter navigation
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      const currentIndex = ALPHABET.indexOf(currentLetter);
      let newIndex;

      if (e.key === 'ArrowLeft') {
        newIndex = currentIndex > 0 ? currentIndex - 1 : ALPHABET.length - 1;
      } else {
        newIndex = currentIndex < ALPHABET.length - 1 ? currentIndex + 1 : 0;
      }

      selectLetter(ALPHABET[newIndex]);
      return;
    }

    // Arrow keys for grid navigation (when overlay is closed)
    if (!document.getElementById('overlay').classList.contains('visible')) {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        // Could implement cell-to-cell navigation here if needed
        return;
      }
    }
  });

  // ─── ANDROID BACK BUTTON ───
  window.addEventListener('popstate', (e) => {
    if (document.getElementById('dialogBackdrop').classList.contains('visible')) {
      discardChanges();
      e.preventDefault();
    } else if (document.getElementById('overlay').classList.contains('visible')) {
      handleClose();
      e.preventDefault();
    }
  });

  // Push initial state for back button handling
  if (window.history && window.history.pushState) {
    window.history.pushState({}, '');
  }

  // ─── INIT ───
  loadData();
  updateLetterDisplay();
  renderLetterBar();
  setGrid(gridCols);
</script>
</body>
</html>
